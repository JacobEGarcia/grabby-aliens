<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grabby Aliens</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ea;--ink:#232a1e;--dim:#7b8570;--lime:#58a447;--line:#dddccb;--card:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px 64px}
h1{font-size:36px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--dim);font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px}
#field{width:min(560px,94vw);height:340px;margin:22px 0;background:radial-gradient(circle at 50% 26%,#1a2646,#0a0f1e);border:1px solid #c9c9b6;border-radius:16px;position:relative;overflow:hidden}
#field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(#2c4632,#223a28)}
#ufo{position:absolute;font-size:46px;top:16px;left:44%;z-index:2;transition:left .25s}
#beam{position:absolute;left:calc(44% + 8px);top:64px;width:30px;height:0;background:linear-gradient(rgba(140,240,110,.65),transparent);transition:height .25s,left .25s;z-index:1}
.cow{position:absolute;font-size:28px;transition:bottom .8s,opacity .5s;z-index:2}
#hud{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);text-align:center;line-height:2}
#hud b{color:var(--lime);margin:0 3px}
#pad{display:flex;gap:10px;margin-top:16px}
#pad button{cursor:pointer;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transition:all .15s}
#pad button:hover{border-color:var(--lime);color:var(--lime)}
#grab{background:var(--lime);border-color:var(--lime);color:#fff;padding:12px 30px}
#grab:hover{background:#4a8c3c;color:#fff}
#msg{margin-top:16px;font-size:13.5px;color:var(--dim);max-width:480px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<h1>Grabby Aliens</h1>
<div class="sub">they came for the cows &middot; they will not say why</div>
<div id="field"><div id="ufo">🛸</div><div id="beam"></div></div>
<div id="hud">Cows grabbed <b id="grabbed">0</b> &middot; Cows remaining <b id="left">8</b> &middot; Farmer alertness <b id="alert">0</b>%</div>
<div id="pad">
  <button id="l">&lt; Left</button>
  <button id="grab">Grab</button>
  <button id="r">Right &gt;</button>
</div>
<div id="msg">position over a cow and grab. grabbing raises the farmer's alertness.</div>
<script>
const $=id=>document.getElementById(id);
const field=$('field');
let ux=44,grabbed=0,left=8,alert=0,cows=[];
for(let i=0;i<8;i++){
  const c=document.createElement('div');c.className='cow';c.textContent='🐄';
  c._x=4+i*12;c.style.left=c._x+'%';c.style.bottom='6px';
  field.appendChild(c);cows.push(c);
}
function place(){$('ufo').style.left=ux+'%';$('beam').style.left='calc('+ux+'% + 8px)';}
function mv(d){ux=Math.max(2,Math.min(88,ux+d*8));place();}
$('l').onclick=()=>mv(-1);$('r').onclick=()=>mv(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')mv(-1);if(e.key==='ArrowRight')mv(1);if(e.key===' ')$('grab').click();});
$('grab').onclick=()=>{
  $('beam').style.height='260px';
  setTimeout(()=>$('beam').style.height='0',400);
  const target=cows.find(c=>Math.abs(c._x-ux)<7);
  if(target){
    target.style.bottom='300px';target.style.opacity='0';
    setTimeout(()=>target.remove(),800);
    cows=cows.filter(c=>c!==target);
    grabbed++;left--;$('grabbed').textContent=grabbed;$('left').textContent=left;
    alert=Math.min(100,alert+15);
    const m=['the cow ascends, surprisingly calm','one more for the mothership. the moo fades upward','grabbed. the herd pretends not to notice'];
    $('msg').textContent=m[Math.floor(Math.random()*m.length)];
    if(left===0)$('msg').textContent='FIELD EMPTY. '+grabbed+' cows acquired. The aliens leave a note: "THX." The farmer finds only crop circles and questions.';
  }else{
    alert=Math.min(100,alert+8);
    $('msg').textContent='the beam grabs only hay. the farmer stirs.';
  }
  $('alert').textContent=alert;
  if(alert>=100){cows.forEach(c=>c.remove());$('msg').textContent='THE FARMER EMERGES WITH A FLASHLIGHT AND OPINIONS. Score: '+grabbed+' cows grabbed. The UFO departs at a casual, suspicious speed.';field.querySelectorAll('button,#ufo').forEach(()=>{});ux=-999;place();}
};
setInterval(()=>{alert=Math.max(0,alert-1);$('alert').textContent=alert;},900);
place();
</script>
</body>
</html>
